name: Prüfung

on:
  push:
    branches: [main]
  pull_request:

jobs:
  hassfest:
    name: Home-Assistant-Prüfung (hassfest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: home-assistant/actions/hassfest@master

  tests:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -r requirements-dev.txt
      - run: pytest -q

  hacs:
    name: HACS-Prüfung
    runs-on: ubuntu-latest
    steps:
      - uses: hacs/action@main
        with:
          category: integration
          # Das Symbol liefert die Integration selbst mit (custom_components/k9sntnl/brand/, ab Home Assistant
          # 2026.3); ein Eintrag im Repo home-assistant/brands ist dafür nicht nötig
          ignore: brands
